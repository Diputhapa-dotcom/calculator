<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">

      <div class="result">
        <input type="text" class="output">
      </div>





      <div class="input">

        <div class="left">
          <button class="number" onclick="num(1)">1</button>
          <button class="number" onclick="num(2)">2</button>
          <button class="number" onclick="num(3)">3</button>
          <button class="number" onclick="num(4)">4</button>
        </div>




        <div class="right">
            <button class="button" onclick="add()">+</button>
            <button class="button" onclick="equal()" id="equal">=</button>
        </div>
      </div>
    </div>


    <div id="parent"></div>
<script src="script.js"></script>
</body>
</html>
